<!doctype html>
<html>
  <head>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body>
    <button id="btn">执行请求</button>

    <script>
      $("#btn").click(function () {
        $.Deferred(function (def) {
          // 模拟异步
          setTimeout(function () {
            // 随机成功或失败
            if (Math.random() > 0.5) {
              def.resolve("成功");
            } else {
              def.reject("失败");
            }
          }, 1000);
        })
          .done(function (res) {
            console.log("done:", res);
          })
          .fail(function (err) {
            console.log("fail:", err);
          })
          .always(function () {
            console.log("always: 无论成功或失败都会执行");
          });
      });
    </script>
  </body>
</html>
