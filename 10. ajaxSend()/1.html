<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>jQuery ajaxSend Demo</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
      body {
        font-family: Arial;
        padding: 20px;
      }
      .box {
        margin-top: 10px;
        padding: 10px;
        border: 1px solid #ccc;
      }
      .log {
        color: blue;
      }
    </style>
  </head>
  <body>
    <h2>ajaxSend() Demo</h2>

    <button id="btn">发送 Ajax 请求</button>

    <div class="box log">日志：</div>
    <div class="box result">结果：</div>

    <script>
      $(document).ready(function () {
        // ✅ ajaxSend 事件（请求发送前触发）
        $(document).ajaxSend(function (event, xhr, options) {
          $(".log").append("<p>发送请求: " + options.url + "</p>");

          // 示例：添加请求头
          xhr.setRequestHeader("X-Demo", "ajaxSend-example");
        });

        // 点击按钮发送 Ajax
        $("#btn").click(function () {
          $.ajax({
            url: "https://jsonplaceholder.typicode.com/posts/1",
            type: "GET",
            success: function (data) {
              $(".result").html("<p><b>Title:</b> " + data.title + "</p>");
            },
            error: function () {
              $(".result").html("<p style='color:red'>请求失败</p>");
            },
          });
        });
      });
    </script>
  </body>
</html>
