<!doctype html>
<html>
  <head>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body>
    <button id="btn">发送请求</button>

    <script>
      $("#btn").click(function () {
        $.get("error.php") // 假设这个请求会失败
          .then(function (res) {
            console.log("成功:", res);
          })
          .catch(function (err) {
            console.log("失败:", err);
          });
      });
    </script>
  </body>
</html>
