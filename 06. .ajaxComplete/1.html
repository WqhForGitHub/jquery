<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ajaxComplete Demo</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
      }
      #log {
        margin-top: 20px;
        padding: 10px;
        border: 1px solid #ccc;
        background: #f9f9f9;
      }
    </style>
  </head>
  <body>
    <h2>jQuery ajaxComplete Demo</h2>

    <button id="load">Send AJAX Request</button>

    <div id="log">
      <strong>Log:</strong>
    </div>

    <script>
      $(document).ready(function () {
        // 绑定 ajaxComplete 全局事件
        $(document).ajaxComplete(function (event, xhr, settings) {
          $("#log").append(
            "<p>AJAX request completed: " + settings.url + "</p>",
          );
        });

        // 点击按钮触发 AJAX
        $("#load").on("click", function () {
          $.ajax({
            url: "https://jsonplaceholder.typicode.com/todos/1",
            method: "GET",
            success: function (data) {
              $("#log").append(
                "<p>Data loaded: " + JSON.stringify(data) + "</p>",
              );
            },
          });
        });
      });
    </script>
  </body>
</html>
